<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit task | StudyMate</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: #eef4ff; color: #172033; font-family: "Segoe UI", Arial, sans-serif; }
        .card { width: min(100%, 560px); padding: 30px; border: 1px solid #dbe4ee; border-radius: 18px; background: white; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.1); }
        h1 { color: #0f1f38; }
        .field { margin: 16px 0; }
        label { display: block; margin-bottom: 7px; color: #334155; font-weight: 700; }
        input, select { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
        .errorlist { color: #b91c1c; }
        button, a { display: inline-block; border: 0; border-radius: 9px; padding: 11px 16px; font-weight: 700; text-decoration: none; cursor: pointer; }
        button { background: #2563eb; color: white; }
        a { background: #e2e8f0; color: #1f2937; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
    {% include "study_app/includes/app_styles.html" %}
</head>
<body>
    <main class="card">
        {% include "study_app/includes/back_button.html" with back_url="/tasks/" %}
        <h1>Edit study task</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            {{ form.non_field_errors }}
            <div class="actions">
                <button type="submit">Save changes</button>
                <a href="{% url 'task_tracking' %}">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
