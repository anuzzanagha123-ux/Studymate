<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ module.name }} | StudyMate</title>
    <style>
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; background: radial-gradient(circle at top right, #dbeafe 0, transparent 36%), #eef3f8; color: #172033; font-family: "Segoe UI", Arial, sans-serif; }
        main { position: relative; width: min(100%, 680px); overflow: hidden; padding: clamp(28px, 6vw, 48px); border: 1px solid #dbe4ee; border-radius: 20px; background: #fff; box-shadow: 0 18px 40px rgba(15, 31, 56, 0.1); }
        main::before { position: absolute; top: 0; left: 0; width: 100%; height: 7px; background: linear-gradient(90deg, #1d4ed8, #60a5fa); content: ""; }
        .eyebrow { margin: 0 0 12px; color: #2563eb; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; }
        h1 { margin: 0; color: #0f1f38; font-size: clamp(1.8rem, 5vw, 2.5rem); letter-spacing: -0.04em; }
        p { margin: 14px 0 0; color: #64748b; font-size: 1rem; line-height: 1.7; }
        a { display: inline-block; margin-top: 28px; padding: 10px 14px; border-radius: 8px; background: #2563eb; color: #fff; font-size: 0.9rem; font-weight: 700; text-decoration: none; transition: background 0.2s, transform 0.2s; }
        a:hover { transform: translateY(-1px); background: #1d4ed8; }
    </style>
    {% include "study_app/includes/app_styles.html" %}
</head>
<body>
    <main>
        {% include "study_app/includes/back_button.html" with back_url="/dashboard/" %}
        <p class="eyebrow">StudyMate module</p>
        <h1>{{ module.name }}</h1>
        <p>{{ module.description }}</p>
    </main>
</body>
</html>
